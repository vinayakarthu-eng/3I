services:
  postgres:
    image: postgres:16-alpine
    container_name: drillforce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drillforce
      POSTGRES_PASSWORD: drillforce
      POSTGRES_DB: drillforce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drillforce"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: drillforce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
