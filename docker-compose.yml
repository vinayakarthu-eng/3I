services:
  postgres:
    image: postgres:16-alpine
    container_name: drillforce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drillforce
      POSTGRES_PASSWORD: drillforce
      POSTGRES_DB: drillforce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drillforce"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: drillforce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # Datadog Agent — receives the injection engine's OTLP telemetry (traces → APM, metrics, logs) and
  # forwards it to your Datadog account. Opt-in: `docker compose --profile datadog up -d` with
  # DD_API_KEY (and DD_SITE if not datadoghq.com) in .env. Without it the engine runs a dry run.
  datadog-agent:
    image: datadog/agent:7.60.0
    container_name: drillforce-datadog-agent
    profiles: ["datadog"]
    restart: unless-stopped
    env_file: .env
    environment:
      DD_HOSTNAME: drillforce-drills
      DD_ENV: drill
      DD_APM_ENABLED: "true"
      DD_LOGS_ENABLED: "true"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: 0.0.0.0:4318
      DD_OTLP_CONFIG_LOGS_ENABLED: "true"
    ports:
      - "4318:4318"

volumes:
  postgres-data:
  redis-data:
